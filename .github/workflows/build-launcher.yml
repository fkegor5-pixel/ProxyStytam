name: Build Launcher APK

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Build release APKs
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Verify APKs
        run: |
          BT=$ANDROID_HOME/build-tools/33.0.2
          mkdir out
          cp launcher/app/build/outputs/apk/home/release/app-home-release.apk out/ProxyLauncher.apk
          cp launcher/app/build/outputs/apk/plain/release/app-plain-release.apk out/ProxyLauncher-TEST.apk
          for f in out/*.apk; do
            echo "== $f"
            $BT/apksigner verify --verbose "$f"
            $BT/aapt2 dump badging "$f" | grep -E "^(package|sdkVersion|targetSdkVersion|application-debuggable|native-code)"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ProxyLauncher
          path: out/*.apk
          retention-days: 30
