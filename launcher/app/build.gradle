plugins {
    id 'com.android.application'
}

android {
    namespace 'com.proxystytam.launcher'
    compileSdk 33

    defaultConfig {
        applicationId "com.proxystytam.launcher"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    // shortcut: debug-style key committed to the repo so every CI build updates in place; use a private key before publishing anywhere
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    // "plain" has no HOME filter: if only it installs, the firmware refuses third-party launchers
    flavorDimensions 'mode'
    productFlavors {
        home { dimension 'mode' }
        plain { dimension 'mode' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
    }
}
